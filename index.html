<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SW Tracker">
<title>SW Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="titlebar"><h1 id="pageTitle">Coleção</h1><span id="syncDot" class="sync" title="Sincronização"></span></div>
    <div id="stats" class="stats"></div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Buscar pelo nome…" autocomplete="off">
      <button id="btnFilter" class="iconbtn" aria-label="Filtros">⚙︎<span id="fcount" class="badge" hidden></span></button>
    </div>
    <div id="chips" class="chips"></div>
  </header>
  <main id="list"></main>
  <section id="settings" hidden></section>
  <nav id="tabs">
    <button data-tab="tenho" class="on"><i>📚</i>Coleção</button>
    <button data-tab="quero"><i>⭐</i>Desejos</button>
    <button data-tab="nao"><i>🔍</i>Faltando</button>
    <button data-tab="ajustes"><i>☁️</i>Ajustes</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-panel" id="sheetPanel"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
